<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Enigma Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/site.css">
<script>try{var t=localStorage.getItem("enigma-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  body{min-height:100vh}
  .admin-top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .admin-top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:14px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}
  .brand small{font-family:var(--f-hud);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--accent-text)}
  .mode{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;background:var(--inner);color:var(--muted2)}
  .mode.live{background:var(--green-bg);color:var(--green)}
  .mode.demo{background:var(--red-bg);color:var(--red)}
  .top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted2)}
  .top-actions .btn{min-height:40px;padding:0 16px;font-size:14px}
  .login{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:40px}
  .login form{width:min(420px,100%);display:grid;gap:16px;padding:32px;border:1px solid var(--border-strong);border-radius:0 0 40px 0;background:var(--card)}
  .login h1{margin:0;font-weight:800;font-size:32px;color:var(--hi)}
  .msg{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:10px}
  .msg.err{background:var(--red-bg);color:var(--red)}
  .msg.info{background:var(--inner);color:var(--soft)}
  .layout{display:flex;flex-wrap:wrap;gap:28px;padding-block:28px 140px;align-items:flex-start}
  .side{flex:1 1 220px;max-width:100%;display:grid;gap:4px;position:sticky;top:84px}
  .side button{text-align:left;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-weight:600;font-size:15px;cursor:pointer}
  .side button[aria-current="true"]{background:var(--inv);color:var(--on-inv)}
  @media (max-width:860px){.side{position:static;display:flex;flex-wrap:wrap;flex-basis:100%}.side button{min-height:40px}}
  .panel{flex:999 1 620px;min-width:0;display:grid;gap:22px}
  .panel h2{margin:0;font-weight:800;font-size:30px;color:var(--hi)}
  .panel .hint{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
  .box{padding:20px;border:1px solid var(--line2);border-radius:0 0 24px 0;background:var(--card);display:grid;gap:14px;min-width:0}
  .box h3{margin:0;font-family:var(--f-hud);font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--hi);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
  .f{display:grid;gap:6px;min-width:0}
  .f span{font-size:13px;font-weight:600;color:var(--muted)}
  .f input,.f textarea,.f select{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line3);background:var(--bg);color:var(--hi);font-size:15px}
  .f textarea{padding:10px 12px;line-height:1.5;resize:vertical;min-height:84px}
  .f.chk{display:flex;align-items:center;gap:10px}
  .f.chk input{width:20px;height:20px;min-height:0}
  .row-item{display:grid;gap:12px;padding:14px;border-radius:12px;background:var(--inner)}
  .row-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted2)}
  .tools{display:flex;gap:6px}
  .tools button,.add{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line3);background:transparent;color:var(--hi);cursor:pointer;font-size:13px;font-weight:600}
  .tools button.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
  .add{justify-self:start;border-style:dashed;min-height:42px;padding:0 16px}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--inv);color:var(--on-inv);transform:translateY(110%);transition:transform .2s}
  .savebar.show{transform:none}
  .savebar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px max(14px,env(safe-area-inset-bottom,0px))}
  .savebar button{min-height:46px;padding:0 22px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
  .savebar .primary{background:var(--accent);color:#fff}
  .savebar .ghost{background:transparent;color:var(--on-inv);border:1px solid var(--inv-dash)}
  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:30;padding:12px 18px;border-radius:12px;background:var(--inv);color:var(--on-inv);font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .stage-items{display:grid;gap:10px}
</style>
</head>
<body>
<header class="admin-top">
  <div class="wrap">
    <div class="brand">ENIGMA STUDIO <small>ADMIN</small> <span class="mode" id="modeBadge"></span></div>
    <div class="top-actions">
      <span id="whoami"></span>
      <a class="btn" href="index.html" target="_blank" rel="noopener">Lihat situs</a>
      <button type="button" class="btn hidden" id="logoutBtn">Keluar</button>
    </div>
  </div>
</header>

<section class="wrap login" id="loginView">
  <form id="loginForm" novalidate>
    <span class="eyebrow">◇ ADMIN LOGIN</span>
    <h1>Masuk ke panel</h1>
    <div class="msg info hidden" id="demoInfo">Supabase belum diatur di <code>js/config.js</code>, jadi panel berjalan dalam <strong>mode demo</strong>. Perubahan hanya tersimpan di browser ini dan tidak terlihat pengunjung lain.</div>
    <label class="f"><span>Email</span><input id="loginEmail" type="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
    <div class="msg err hidden" id="loginErr" role="alert"></div>
    <button type="submit" class="btn btn-solid" id="loginBtn" style="min-height:50px">Masuk</button>
    <button type="button" class="btn hidden" id="demoBtn">Coba mode demo</button>
  </form>
</section>

<div class="wrap layout hidden" id="appView">
  <nav class="side" id="sideNav" aria-label="Bagian"></nav>
  <main class="panel" id="panel"></main>
</div>

<div class="savebar" id="saveBar" role="region" aria-label="Simpan perubahan">
  <div class="wrap">
    <span id="saveMsg">Ada perubahan yang belum disimpan.</span>
    <span style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="ghost" id="discardBtn">Batalkan</button>
      <button type="button" class="primary" id="saveBtn">Simpan &amp; terbitkan</button>
    </span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="/api/config"></script>
<script src="js/content-default.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
